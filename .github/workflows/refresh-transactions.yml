name: Refresh Dong-gu transactions and publish dashboard

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.html', '*.js', '*.css', '*.svg', '*.webmanifest', 'data/**', '.github/workflows/refresh-transactions.yml']

concurrency:
  group: dandi-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate MOLIT data
        if: github.event_name != 'push'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python3 scripts/refresh-transactions.py
      - name: Commit verified data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Daegu Dong-gu apartment transactions'
            git push origin HEAD:main
          fi
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html app.js styles.css icon.svg manifest.webmanifest service-worker.js _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
